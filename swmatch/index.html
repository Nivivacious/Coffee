<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>swmatch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="swmatch finds dupes for lipsticks, blushes, foundations and highlighters by swatch colour, undertone, depth, finish and payoff, with Indian prices and stores.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a two-pane counter. Left, the shade library you browse like a
   tester tray; right, the match card for the shade in your hand. */
:root {
  --coral: #F26671;       /* brand ground: the logo's background */
  --butter: #F8F3A6;      /* the slash: highlights and the match itself */
  --on-coral: #FFFFFF;    /* the wordmark */
  --violet: #C8404D;      /* primary actions (deep coral, passes contrast on white) */
  --violet-ink: #B5303E;  /* coral that reads as text */
  --bg: #FFF8F6;
  --surface: #FFFFFF;
  --sunk: #FDEDEB;
  --ink: #3A1E24;
  --ink-2: #7A5A5F;
  --line: #F4D9D6;
  --good: #1F8A5B; --warn: #B7791F;
  --shadow: 0 1px 2px rgba(58, 30, 36, .06), 0 8px 24px -12px rgba(58, 30, 36, .18);
  --f-display: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --coral: #D9505C; --butter: #F8F3A6; --on-coral: #FFFFFF; --violet: #F26671; --violet-ink: #FF9AA2;
    --bg: #1E1416; --surface: #2A1C1F; --sunk: #36252A; --ink: #FFF1F0; --ink-2: #D2B4B7; --line: #4A3236;
    --good: #4CC08A; --warn: #E3AE52;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --coral: #D9505C; --butter: #F8F3A6; --on-coral: #FFFFFF; --violet: #F26671; --violet-ink: #FF9AA2;
  --bg: #1E1416; --surface: #2A1C1F; --sunk: #36252A; --ink: #FFF1F0; --ink-2: #D2B4B7; --line: #4A3236;
  --good: #4CC08A; --warn: #E3AE52;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.55 var(--f-body);
}
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select { font: inherit; color: inherit; }
a { color: var(--violet-ink); }
:focus-visible { outline: 3px solid var(--butter); box-shadow: 0 0 0 5px var(--ink); outline-offset: 2px; border-radius: 8px; }
.mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1240px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }

/* ---------- masthead ---------- */
.mast { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 22px 8px; flex-wrap: wrap; }
.logo { height: 34px; width: auto; display: block; }
.logo .lg-ink { fill: var(--on-coral); }
.logo .lg-slash { fill: var(--butter); }
.band { background: var(--coral); color: var(--on-coral); }
.band a { color: var(--on-coral); }
.mast nav { display: flex; gap: 18px; font-weight: 800; }
.mast nav a { text-decoration: none; opacity: .85; }
.mast nav a:hover { opacity: 1; text-decoration: underline; text-decoration-color: var(--butter); text-decoration-thickness: 3px; text-underline-offset: 5px; }

.intro { display: grid; gap: 18px; padding-block: 26px 40px; }
.intro h1 { font-size: clamp(30px, 5vw, 52px); line-height: 1.04; font-weight: 900; letter-spacing: -.02em; max-width: 18ch; }
.intro h1 .slash { color: var(--butter); }
.intro p { margin: 0; max-width: 60ch; font-size: 16px; opacity: .95; }

/* ask bar */
.ask { display: flex; gap: 8px; background: var(--surface); color: var(--ink); border: 2px solid transparent; border-radius: 999px; padding: 6px 6px 6px 20px; box-shadow: var(--shadow); max-width: 760px; }
.ask:focus-within { border-color: var(--butter); }
.ask input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 16px; font-weight: 600; outline: none; }
.ask button { border: 0; background: var(--violet); color: #fff; font-weight: 800; padding: 10px 20px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.ask button:hover { filter: brightness(1.08); }
.examples { display: flex; flex-wrap: wrap; gap: 8px; }
.examples button { border: 1px solid rgba(255,255,255,.55); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 700; color: var(--on-coral); cursor: pointer; }
.examples button:hover { background: var(--butter); border-color: var(--butter); color: #3A1E24; }

#askResults { max-width: 1240px; margin: 18px auto 0; }
.ask-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-block: 4px 18px; box-shadow: var(--shadow); }
.ask-panel h3 { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
.ask-panel .parsed { color: var(--ink-2); font-size: 13px; margin-bottom: 12px; }
.mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.mini { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; text-align: left; }
.mini:hover { border-color: var(--violet); }
.mini .t { min-width: 0; font-size: 13px; line-height: 1.3; }
.mini .t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini .t span { color: var(--ink-2); }

/* ---------- workbench ---------- */
.bench { margin-top: 22px; display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 960px) { .bench { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.lib { padding: 16px; display: grid; gap: 14px; position: sticky; top: max(12px, env(safe-area-inset-top, 0px)); max-height: calc(100vh - 24px); overflow: auto; }
@media (max-width: 960px) { .lib { position: static; max-height: none; } }

.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--sunk); padding: 4px; border-radius: 14px; }
.tabs button { border: 0; background: transparent; padding: 8px 4px; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; color: var(--ink-2); line-height: 1.2; }
.tabs button small { display: block; font-weight: 600; font-size: 11px; opacity: .8; }
.tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

.seg { display: inline-flex; gap: 2px; background: var(--sunk); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--violet); color: #fff; }

.field { display: grid; gap: 6px; }
.field label { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.field select, .field input[type="search"] { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 9px 12px; font-weight: 700; }

.brands { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .flag { font-size: 10px; font-weight: 900; letter-spacing: .04em; color: var(--violet-ink); }
.chip[aria-pressed="true"] .flag { color: var(--butter); }

.lines { display: grid; gap: 10px; }
.line { border: 1px solid var(--line); border-radius: 14px; padding: 10px; background: var(--bg); }
.line h4 { margin: 0 0 2px; font-size: 14px; font-weight: 800; }
.line .meta { font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; position: relative; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.dot[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--surface) inset; }
.dot:hover { transform: scale(1.08); }

/* ---------- match card ---------- */
.match { padding: 22px; display: grid; gap: 20px; }
.hero { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 22px; align-items: center; }
@media (max-width: 560px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.hero h2 { font-size: clamp(26px, 3.6vw, 38px); font-weight: 900; line-height: 1.05; letter-spacing: -.01em; }
.hero .who { font-weight: 800; color: var(--ink-2); }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.fact { background: var(--sunk); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.fact b { font-weight: 900; }
.fact.hex { font-family: var(--f-data); font-weight: 500; }

/* Swatch: a smear of product. The finish is drawn, not just labelled. */
.smear { --c: #c27a73; position: relative; width: 100%; max-width: 170px; aspect-ratio: 1.15; border-radius: 58% 42% 55% 45% / 52% 60% 40% 48%; background: var(--c); box-shadow: inset 0 -10px 22px rgba(0,0,0,.14), 0 6px 18px -8px rgba(0,0,0,.35); overflow: hidden; }
.smear::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
.fin-satin::after, .fin-cream::after, .fin-natural::after { background: linear-gradient(135deg, rgba(255,255,255,.22), transparent 45%); }
.fin-soft-matte::after { background: linear-gradient(135deg, rgba(255,255,255,.1), transparent 50%); }
.fin-dewy::after, .fin-radiant::after { background: radial-gradient(ellipse 45% 30% at 34% 30%, rgba(255,255,255,.55), transparent 70%); }
.fin-glossy::after { background: radial-gradient(ellipse 50% 22% at 40% 26%, rgba(255,255,255,.75), transparent 70%), linear-gradient(160deg, rgba(255,255,255,.2), transparent 50%); }
.fin-shimmer::after { background: radial-gradient(circle at 20% 30%, rgba(255,255,255,.9) 0 1px, transparent 1.6px) 0 0/9px 9px, radial-gradient(circle at 70% 60%, rgba(255,255,255,.7) 0 1px, transparent 1.6px) 0 0/13px 13px, radial-gradient(ellipse 50% 35% at 35% 30%, rgba(255,255,255,.4), transparent 70%); }
.fin-metallic::after { background: linear-gradient(115deg, rgba(255,255,255,0) 20%, rgba(255,255,255,.65) 40%, rgba(255,255,255,0) 58%), radial-gradient(circle at 30% 40%, rgba(255,255,255,.8) 0 1px, transparent 1.6px) 0 0/8px 8px; }

.controls { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: end; padding: 14px; border-radius: 14px; background: var(--sunk); }
.controls .field { min-width: 0; }
.controls .field.grow { flex: 1 1 200px; }
.toggle { display: inline-flex; gap: 8px; align-items: center; font-weight: 700; font-size: 14px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--violet); }
input[type="range"] { width: 100%; accent-color: var(--violet); }

.summary { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; justify-content: space-between; }
.summary h3 { font-size: 20px; font-weight: 900; }
.summary p { margin: 0; color: var(--ink-2); font-size: 14px; }

.dupes { display: grid; gap: 14px; }
.dupe { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 16px; padding: 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.dupe.top { border: 2px solid var(--coral); }
@media (max-width: 640px) { .dupe { grid-template-columns: 72px minmax(0, 1fr); } .dupe .score { grid-column: 1 / -1; grid-row: 1; justify-self: start; display: flex; gap: 10px; align-items: center; } }

/* Split swatch: original on the left, dupe on the right, the slash between. */
.split { position: relative; width: 100%; aspect-ratio: 1; border-radius: 50%; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.split i { position: absolute; inset: 0; }
.split i:first-child { clip-path: polygon(0 0, 58% 0, 42% 100%, 0 100%); }
.split i:last-child { clip-path: polygon(58% 0, 100% 0, 100% 100%, 42% 100%); }
.split::after { content: ""; position: absolute; left: 50%; top: -6%; width: 7px; height: 112%; background: var(--surface); transform: translateX(-50%) rotate(9deg); border-radius: 4px; }
.split-cap { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 800; color: var(--ink-2); margin-top: 4px; text-transform: uppercase; letter-spacing: .05em; }

.dupe h4 { margin: 0; font-size: 17px; font-weight: 900; line-height: 1.2; }
.dupe .by { font-weight: 700; color: var(--ink-2); font-size: 13.5px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag { font-size: 11.5px; font-weight: 800; border-radius: 999px; padding: 2px 9px; background: var(--sunk); color: var(--ink-2); }
.tag.in { background: color-mix(in srgb, var(--coral) 16%, transparent); color: var(--violet-ink); }
.tag.cite { background: color-mix(in srgb, var(--butter) 70%, transparent); color: #6a5a00; }
.tag.v-twin { background: var(--violet); color: #fff; }
.tag.v-close { background: color-mix(in srgb, var(--coral) 22%, transparent); color: var(--violet-ink); }
.tag.v-near { background: color-mix(in srgb, var(--butter) 75%, transparent); color: #5c5200; }

.price { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-top: 10px; font-weight: 800; }
.price .now { font-size: 18px; }
.price .save { color: var(--good); font-size: 13px; }
.price .more { color: var(--warn); font-size: 13px; }

.bars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 14px; margin-top: 12px; }
@media (max-width: 640px) { .bars { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.bar { font-size: 11.5px; font-weight: 700; color: var(--ink-2); }
.bar .track { height: 6px; border-radius: 6px; background: var(--sunk); margin-top: 3px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 6px; background: color-mix(in srgb, var(--coral) 45%, var(--sunk)); }
.bar .fill.hi { background: var(--coral); }
.bar span { float: right; font-family: var(--f-data); }

.notes { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; }
.notes li::before { content: "/"; color: var(--coral); font-weight: 900; margin-right: 8px; }
.buy { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.buy a { font-size: 13px; font-weight: 800; text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; color: var(--ink); }
.buy a:hover { border-color: var(--violet); color: var(--violet-ink); }

.score { text-align: center; }
.ring { --p: 80; width: 74px; aspect-ratio: 1; border-radius: 50%; background: conic-gradient(var(--coral) calc(var(--p) * 1%), var(--sunk) 0); display: grid; place-items: center; }
.ring b { width: 60px; aspect-ratio: 1; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-family: var(--f-data); font-size: 17px; font-weight: 500; }
.score small { display: block; font-size: 11px; font-weight: 800; color: var(--ink-2); margin-top: 4px; text-transform: uppercase; letter-spacing: .05em; }

.stylist { border-radius: var(--r); padding: 16px 18px; background: color-mix(in srgb, var(--butter) 45%, var(--surface)); border: 1px solid color-mix(in srgb, var(--butter) 90%, var(--line)); display: grid; gap: 10px; }
.stylist .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.stylist h3 { font-size: 16px; font-weight: 900; }
.stylist button { border: 0; background: var(--violet); color: #fff; font-weight: 800; padding: 8px 16px; border-radius: 999px; cursor: pointer; }
.stylist button[disabled] { opacity: .6; cursor: progress; }
.stylist .out { white-space: pre-wrap; font-size: 14.5px; }
.stylist .out:empty { display: none; }

details.tune { border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
details.tune summary { font-weight: 800; cursor: pointer; }
.weights { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 18px; margin-top: 12px; }
.weights label { font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; }
.weights button { justify-self: start; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; font-weight: 700; cursor: pointer; }
.empty { padding: 26px; text-align: center; color: var(--ink-2); border: 1px dashed var(--line); border-radius: var(--r); }

/* ---------- method ---------- */
.method { margin-top: 56px; margin-bottom: 48px; display: grid; gap: 22px; }
.method > h2 { font-size: clamp(24px, 3vw, 32px); font-weight: 900; }
.crit { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.crit div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.crit h3 { font-size: 15px; font-weight: 900; display: flex; justify-content: space-between; gap: 8px; }
.crit h3 span { font-family: var(--f-data); font-weight: 500; font-size: 12px; color: var(--ink-2); }
.crit p { margin: 6px 0 0; font-size: 14px; color: var(--ink-2); }
.fine { font-size: 13.5px; color: var(--ink-2); max-width: 75ch; display: grid; gap: 8px; }
.fine p { margin: 0; }
footer .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; padding-block: 22px; }
footer .logo { height: 20px; }


/* ---------- decluttered pieces ---------- */
#brand { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; font-weight: 800; }
.line h4 span { font-weight: 600; color: var(--ink-2); font-size: 12.5px; margin-left: 6px; }
.hero .who { font-weight: 700; color: var(--ink-2); font-size: 14px; }
.hero .facts { margin: 8px 0 0; color: var(--ink-2); font-size: 14px; display: block; }
.hero .cost { margin: 10px 0 0; font-weight: 900; font-size: 20px; }
.hero .cost span { font-weight: 600; font-size: 13px; color: var(--ink-2); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 13.5px; font-weight: 800; cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.filters select { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 13.5px; font-weight: 800; }
.dupe { grid-template-columns: 64px minmax(0, 1fr); align-items: start; }
.dupe .head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.pct { text-align: right; flex: none; }
.pct b { display: block; font-family: var(--f-data); font-weight: 500; font-size: 22px; line-height: 1; color: var(--violet-ink); }
.pct span { font-size: 11.5px; font-weight: 800; color: var(--ink-2); }
.price { margin-top: 6px; }
.price .now { font-size: 16px; }
.price .in { font-size: 12px; font-weight: 800; color: var(--violet-ink); }
.price .more-cost { color: var(--warn); font-size: 13px; }
.cite { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }
.foot { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 12px; font-size: 13px; font-weight: 700; }
.foot a { color: var(--ink-2); }
.foot a.buy1 { background: var(--violet); color: #fff; text-decoration: none; border-radius: 999px; padding: 6px 14px; font-weight: 800; }
details.why { flex-basis: 100%; }
details.why summary { cursor: pointer; color: var(--ink-2); font-weight: 700; }
.more { justify-self: start; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 16px; font-weight: 800; cursor: pointer; }
.extras { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }
.stylist { background: none; border: 0; padding: 0; }
.stylist .out:not(:empty) { background: color-mix(in srgb, var(--butter) 45%, var(--surface)); border-radius: 14px; padding: 14px 16px; }
details.tune { border: 0; padding: 0; }
details.tune summary { color: var(--ink-2); font-weight: 700; }
dl.crit { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 22px; margin: 0; max-width: 820px; }
dl.crit dt { font-weight: 900; }
dl.crit dd { margin: 0; color: var(--ink-2); font-size: 14.5px; }
@media (max-width: 640px) { .dupe { grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding: 14px; } .hero .smear { max-width: 110px; } }
@media (max-width: 560px) { dl.crit { grid-template-columns: minmax(0, 1fr); gap: 2px; } dl.crit dd { margin-bottom: 10px; } }

.dir { margin: 4px 0 0; font-size: 12.5px; font-weight: 800; color: var(--violet-ink); }
.price .unit { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.price .value { font-size: 12px; font-weight: 900; background: var(--butter); color: #4d4500; border-radius: 999px; padding: 1px 9px; }
.conf { margin: 8px 0 0; font-size: 12.5px; color: var(--warn); }
.vote { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); }
.vote button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 800; cursor: pointer; }
.vote button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.vote button:disabled { cursor: default; }
.vote button:disabled:not([aria-pressed="true"]) { opacity: .5; }

@media (prefers-reduced-motion: no-preference) {
  .dupe { animation: rise .35s ease both; }
  .dupe:nth-child(2) { animation-delay: .04s; } .dupe:nth-child(3) { animation-delay: .08s; } .dupe:nth-child(4) { animation-delay: .12s; }
  @keyframes rise { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
  .dot { transition: transform .12s; }
}
